spring.application.name=Assignment_1
server.port=8080
spring.profiles.active=stub

# Concurrency
# Every request is handled on a virtual thread. Blocking on the Cloud STT call then parks the
# virtual thread instead of occupying a platform thread, so the >200 concurrent request target
# is met without either a huge thread pool or a reactive rewrite.
spring.threads.virtual.enabled=true

# Tomcat's accept queue still applies even with virtual threads: connections beyond this back up
# rather than being refused.
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000

# Graceful shutdown
# Required by the /api/v1/admin/shutdown contract: in-flight work drains before the JVM exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Cloud STT provider 
# Read from the OS environment at runtime only. The empty default lets the application start
# under the stub profile with no key present; it is never written to a file or committed.
stt.openai.api-key=${OPENAI_API_KEY:}
stt.openai.base-url=https://api.openai.com
stt.openai.model=gpt-4o-mini-transcribe
stt.openai.timeout-seconds=15

# Do not let Spring dump resolved configuration, which would expose the key on the actuator port.
management.endpoints.web.exposure.include=health
